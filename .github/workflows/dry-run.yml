name: workflow-dry-run
on: [push, pull_request]
jobs: {dry-run: {runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {run: "pip install 'snakemake==7.32.4' 'pulp<2.8' pandas"}, {run: "snakemake -n --forceall --cores 1"}]}}
